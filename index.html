    <style>
        /* ==========================================
           1. CORE VARIABLES & GLOBAL STYLES
           ========================================== */
        :root {
            --primary-blue: #094770;      /* Header, Footer, and Button colors */
            --active-gold: #c2993d;       /* Golden active menu state */
            --text-dark: #333333;         /* Body copy text */
            --input-border: #000000;      /* Outline color for form elements */
            --font-serif: 'Georgia', serif;
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            /* Pastel lavender-blue shades for schedule table styling */
            --table-header-bg: #b5cbeb;
            --cell-blue: #124c73;
            --cell-orange: #c28414;
            --cell-green: #00ff00;
            --cell-pink: #f471e4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* ==========================================
           2. UNIVERSAL NAV HEADER & FOOTER
           ========================================== */
        header {
            background-color: var(--primary-blue);
            padding: 15px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-placeholder {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 12px;
            color: var(--primary-blue);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        nav a:hover {
            color: var(--active-gold);
        }

        nav a.active {
            color: var(--active-gold);
            border-bottom: 2px solid var(--active-gold);
            padding-bottom: 5px;
        }

        footer {
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 20px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-left {
            font-weight: 500;
        }

        .footer-right {
            text-align: right;
            line-height: 1.6;
        }

        .footer-right a {
            color: #ffffff;
            text-decoration: none;
        }

        /* Container helper */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Shared title layout */
        .title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .title-container i {
            font-size: 3.5rem;
            color: #222222;
        }

        .title-container h1 {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #111111;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
        }

        /* Display toggle classes */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .view-section.active-view {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-grid {
            display: grid;

            align-items: center;

            margin: 0 auto;

        .home-left h2 {
            font-family: var(--font-serif);

            font-weight: bold;
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .home-left h2 span.gold-text {
            color: var(--active-gold);
        }

        .home-left p {
            font-size: 16px;
            line-height: 1.6;
            margin-top: 20px;

        }

        .polaroid {
            background-color: #ffffff;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-radius: 4px;
            transform: rotate(-3deg);
            transition: transform 0.3s;
            max-width: 250px;
        }

        .polaroid img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 2px;
        }

        .polaroid:nth-child(2) {
            transform: rotate(4deg) translate(-20px, -10px);
        }

        .polaroid:nth-child(3) {
            transform: rotate(-2deg) translate(-10px, -20px);
        }

        .polaroid:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
        }

            width: 100%;

        .schedule-table-wrapper {
            overflow-x: auto;
            margin-bottom: 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
            font-family: var(--font-sans);
        }

        .schedule-table th, .schedule-table td {
            border: 2px solid #ffffff;
            text-align: center;
            padding: 18px 10px;
            font-size: 16px;
            font-weight: bold;
        }

        /* Header / Day Columns */
        .schedule-table th {
            background-color: var(--table-header-bg);
            color: #000000;
            text-transform: uppercase;
        }

        .schedule-table td.time-column {
            background-color: var(--table-header-bg);
            color: #000000;
            width: 180px;
        }

        /* Color classes mapped directly to screenshot slots */
        .slot-blue { background-color: var(--cell-blue); color: #ffffff; }
        .slot-orange { background-color: var(--cell-orange); color: #ffffff; }
        .slot-green { background-color: var(--cell-green); color: #000000; }
        .slot-pink { background-color: var(--cell-pink); color: #000000; }

        /* Schedule Legend stylings */
        .schedule-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
        }

        .legend-color {
            width: 50px;
            height: 35px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* ==========================================
           5. SECTION 3: SESSION BOOKING

            width: 100%;

            flex-direction: column;
            gap: 8px;
        }

        .form-group label {

            font-size: 18px;
            color: #000000;
