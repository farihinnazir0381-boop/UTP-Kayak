<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTP Kayak Session Booking</title>
    <!-- Font Awesome CDN for clean, modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           1. COLOR PALETTE & GLOBAL VARIABLES 
           Feel free to change these hex codes to customize your site's theme.
           ========================================== */
        :root {
            --primary-blue: #094770;      /* Header and Footer background */
            --active-gold: #c2993d;       /* Selected navigation link color */
            --text-dark: #333333;         /* General body text color */
            --input-border: #000000;      /* Border color of booking pill boxes */
            --font-serif: 'Georgia', serif;
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
            color: var(--text-dark);
        }

        /* ==========================================
           2. NAVIGATION HEADER
           ========================================== */
        header {
            background-color: var(--primary-blue);
            padding: 15px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Placeholder styles for logos. Replace 'src' in HTML with your actual logo files */
        .logo-placeholder {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 12px;
            color: var(--primary-blue);
        }

        .logo-placeholder img {
            height: 100%;
            object-fit: contain;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--active-gold);
        }

        nav a.active {
            color: var(--active-gold);
            border-bottom: 2px solid var(--active-gold);
            padding-bottom: 5px;
        }

        /* ==========================================
           3. MAIN CONTAINER & TITLE
           ========================================== */
        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .title-container i {
            font-size: 4rem;
            color: #222222;
        }

        .title-container h1 {
            font-family: var(--font-serif);
            font-size: 3.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #111111;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
        }

        /* ==========================================
           4. BOOKING FORM GRID
           ========================================== */
        .booking-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 40px;
            row-gap: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: bold;
            font-size: 18px;
            color: #000000;
        }

        /* Pill Container styling */
        .pill-container {
            border: 2px solid var(--input-border);
            border-radius: 50px;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background-color: #ffffff;
            position: relative;
        }

        .pill-container i.field-icon {
            font-size: 24px;
            color: #333333;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }

        /* Inputs & Dropdowns inside pills */
        .pill-container input, 
        .pill-container select {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            height: 100%;
            font-size: 16px;
            font-family: var(--font-sans);
            color: #333333;
            appearance: none; /* Removes default browser dropdown arrow */
            -webkit-appearance: none;
        }

        .pill-container input::placeholder {
            color: #888888;
        }

        /* Custom dropdown arrow positioning */
        .dropdown-indicator {
            position: absolute;
            right: 25px;
            font-size: 12px;
            color: #333333;
            pointer-events: none;
        }

        /* Unique setup for the Pax counter layout */
        .pax-display {
            font-size: 18px;
            font-weight: bold;
            flex-grow: 1;
        }

        .pax-controls {
            display: flex;
            gap: 12px;
        }

        .pax-btn {
            border: 1.5px solid #000000;
            background: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .pax-btn:hover {
            background-color: #f0f0f0;
        }

        /* Small caption text under payment option */
        .helper-text {
            font-size: 13px;
            color: #666666;
            margin-top: 6px;
            text-align: right;
            font-weight: 600;
        }

        /* Optional Form Action Buttons styling */
        .form-actions {
            grid-column: span 3;
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .submit-btn {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #06314f;
        }

        /* ==========================================
           5. FOOTER
           ========================================== */
        footer {
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 20px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: auto;
        }

        .footer-left {
            font-weight: 500;
        }

        .footer-right {
            text-align: right;
            line-height: 1.6;
        }

        .footer-right a {
            color: #ffffff;
            text-decoration: none;
        }

        .footer-right a:hover {
            text-decoration: underline;
        }

        /* Responsive adaptations for smaller screens */
        @media (max-width: 900px) {
            .booking-form {
                grid-template-columns: 1fr;
            }
            .form-actions {
                grid-column: span 1;
            }
            .title-container h1 {
                font-size: 2.2rem;
            }
            header, footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .footer-right {
                text-align: center;
            }
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation Section -->
    <header>
        <div class="logo-section">
            <!-- Left Logo Placeholder (UTP logo) -->
            <div class="logo-placeholder">
                <!-- Replace with your actual image path when ready, e.g. <img src="utp_logo.png" alt="UTP Logo"> -->
                <span>UTP LOGO</span>
            </div>
            <!-- Right Logo Placeholder (Hydra Logo) -->
            <div class="logo-placeholder">
                <!-- Replace with your actual image path when ready -->
                <span>HYDRA LOGO</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Kayak Schedule</a></li>
                <!-- Session Booking is highlighted as active -->
                <li><a href="#" class="active">Session Booking</a></li>
                <li><a href="#">My Booking</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contacts</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main>
        <div class="title-container">
            <!-- Icon resembling the checklist graphic next to the header -->
            <i class="fa-regular fa-calendar-check"></i>
            <h1>Session Booking</h1>
        </div>

        <form class="booking-form" id="kayakBookingForm" onsubmit="handleFormSubmit(event)">
            
            <!-- Column 1, Row 1: Username -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="pill-container">
                    <i class="fa-regular fa-user field-icon"></i>
                    <input type="email" id="username" placeholder="username@gmail.com" required>
                </div>
            </div>

            <!-- Column 2, Row 1: Type of Kayak -->
            <div class="form-group">
                <label for="kayakType">Type of Kayak</label>
                <div class="pill-container">
                    <!-- Note: The mock image uses a person icon here; you can swap it to an anchor or boat icon if preferred -->
                    <i class="fa-regular fa-user field-icon"></i>
                    <select id="kayakType" required>
                        <option value="" disabled selected hidden></option>
                        <option value="single">Single Kayak</option>
                        <option value="double">Double Kayak</option>
                    </select>
                    <div class="dropdown-indicator">v</div>
                </div>
            </div>

            <!-- Column 3, Row 1: Day / Time -->
            <div class="form-group">
                <label for="dayTime">Day / Time</label>
                <div class="pill-container">
                    <i class="fa-regular fa-calendar field-icon"></i>
                    <select id="dayTime" required>
                        <option value="" disabled selected hidden></option>
                        <option value="weekday-morning">Weekdays - Morning</option>
                        <option value="weekday-evening">Weekdays - Evening</option>
                        <option value="weekend-morning">Weekends - Morning</option>
                        <option value="weekend-evening">Weekends - Evening</option>
                    </select>
                    <div class="dropdown-indicator">v</div>
                </div>
            </div>

            <!-- Column 1, Row 2: Session -->
            <div class="form-group">
                <label for="sessionSlot">Session</label>
                <div class="pill-container">
                    <i class="fa-regular fa-clock field-icon"></i>
                    <select id="sessionSlot" required>
                        <option value="" disabled selected hidden></option>
                        <option value="slot1">Session 1 (08:00 AM - 10:00 AM)</option>
                        <option value="slot2">Session 2 (10:30 AM - 12:30 PM)</option>
                        <option value="slot3">Session 3 (02:30 PM - 04:30 PM)</option>
                        <option value="slot4">Session 4 (05:00 PM - 07:00 PM)</option>
                    </select>
                    <div class="dropdown-indicator">v</div>
                </div>
            </div>

            <!-- Column 2, Row 2: Pax -->
            <div class="form-group">
                <label>Pax</label>
                <div class="pill-container">
                    <i class="fa-solid fa-users field-icon"></i>
                    <span class="pax-display" id="paxValue">1</span>
                    <!-- Hidden input to pass actual selected value when form is submitted -->
                    <input type="hidden" id="paxInput" name="pax" value="1">
                    
                    <div class="pax-controls">
                        <button type="button" class="pax-btn" onclick="adjustPax(1)"><i class="fa-solid fa-plus"></i></button>
                        <button type="button" class="pax-btn" onclick="adjustPax(-1)"><i class="fa-solid fa-minus"></i></button>
                    </div>
                </div>
            </div>

            <!-- Column 3, Row 2: Payment -->
            <div class="form-group">
                <label for="paymentMethod">Payment</label>
                <div>
                    <div class="pill-container">
                        <i class="fa-regular fa-credit-card field-icon"></i>
                        <select id="paymentMethod" required>
                            <option value="" disabled selected hidden></option>
                            <option value="student-id">Student ID Card</option>
                            <option value="online-banking">Online Banking</option>
                            <option value="card">Credit / Debit Card</option>
                        </select>
                        <div class="dropdown-indicator">v</div>
                    </div>
                    <div class="helper-text">UTP students may select the option : student ID card</div>
                </div>
            </div>

            <!-- Form submission button -->
            <div class="form-actions">
                <button type="submit" class="submit-btn">Book Session</button>
            </div>
        </form>
    </main>

    <!-- Footer Section -->
    <footer>
        <div class="footer-left">
            Universiti Teknologi PETRONAS • UTP HYDRA Kayak Team
        </div>
        <div class="footer-right">
            +60 xxx xxxx<br>
            <a href="mailto:sharedmailbox@utp.edu.my">sharedmailbox@utp.edu.my</a>
        </div>
    </footer>

    <!-- ==========================================
       6. INTERACTIVITY & CUSTOMIZATION SCRIPTS
       ========================================== */ -->
    <script>
        // Simple counter script for the 'Pax' field
        let currentPax = 1;
        const paxValueSpan = document.getElementById('paxValue');
        const paxHiddenInput = document.getElementById('paxInput');

        function adjustPax(amount) {
            currentPax += amount;
            // Prevent Pax count from dropping below 1
            if (currentPax < 1) {
                currentPax = 1;
            }
            paxValueSpan.textContent = currentPax;
            paxHiddenInput.value = currentPax;
        }

        // Action when "Book Session" button is clicked
        function handleFormSubmit(event) {
            event.preventDefault();
            
            // Collect form data values
            const username = document.getElementById('username').value;
            const kayakType = document.getElementById('kayakType').value;
            const dayTime = document.getElementById('dayTime').value;
            const sessionSlot = document.getElementById('sessionSlot').value;
            const pax = document.getElementById('paxInput').value;
            const paymentMethod = document.getElementById('paymentMethod').value;

            // Log output to console (can be redirected to your backend or email script)
            console.log("Booking Received:", { username, kayakType, dayTime, sessionSlot, pax, paymentMethod });
            alert(`Booking initiated for ${username} (${pax} Pax). Setup backend API handling here!`);
        }
    </script>
</body>
</html>
