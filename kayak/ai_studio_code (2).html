<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTP Kayak - My Booking</title>
    <!-- Font Awesome CDN for clean, modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Shared CSS variables matching your main theme */
        :root {
            --primary-blue: #094770;      /* Header and Footer background */
            --active-gold: #c2993d;       /* Selected navigation link color */
            --text-dark: #333333;         /* General body text color */
            --input-border: #000000;      /* Border color of booking pill boxes */
            --font-serif: 'Georgia', serif;
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
            color: var(--text-dark);
        }

        /* Navigation Header */
        header {
            background-color: var(--primary-blue);
            padding: 15px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-placeholder {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 12px;
            color: var(--primary-blue);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--active-gold);
        }

        nav a.active {
            color: var(--active-gold);
            border-bottom: 2px solid var(--active-gold);
            padding-bottom: 5px;
        }

        /* Main Container & Layout */
        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .title-container i {
            font-size: 4rem;
            color: #222222;
        }

        .title-container h1 {
            font-family: var(--font-serif);
            font-size: 3.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #111111;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
        }

        /* Layout Grid for Left and Right Panels */
        .my-booking-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 50px;
            align-items: flex-start;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group label {
            font-weight: bold;
            font-size: 18px;
            color: #000000;
        }

        /* Left-side pill container */
        .pill-container {
            border: 2px solid var(--input-border);
            border-radius: 50px;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background-color: #ffffff;
        }

        .pill-container i.field-icon {
            font-size: 24px;
            color: #333333;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }

        .pill-container input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            height: 100%;
            font-size: 16px;
            font-family: var(--font-sans);
            color: #333333;
        }

        /* Right-side Detail Card with bold borders */
        .detail-card {
            border: 4px solid #000000; /* Bold black borders matching screenshot */
            border-radius: 40px;       /* Heavily rounded corners */
            padding: 30px 45px;
            background-color: #ffffff;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .detail-card h2 {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            font-family: var(--font-sans);
            color: #000000;
        }

        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #000000;
            line-height: 1.5;
        }

        .detail-item {
            display: grid;
            grid-template-columns: 200px 1fr;
        }

        .detail-val {
            font-weight: normal;
            color: #444444;
        }

        /* Footer */
        footer {
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 20px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: auto;
        }

        .footer-left {
            font-weight: 500;
        }

        .footer-right {
            text-align: right;
            line-height: 1.6;
        }

        .footer-right a {
            color: #ffffff;
            text-decoration: none;
        }

        /* Responsive adaptation */
        @media (max-width: 900px) {
            .my-booking-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .detail-item {
                grid-template-columns: 130px 1fr;
                font-size: 16px;
            }
            header, footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .footer-right {
                text-align: center;
            }
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation Section -->
    <header>
        <div class="logo-section">
            <div class="logo-placeholder"><span>UTP LOGO</span></div>
            <div class="logo-placeholder"><span>HYDRA LOGO</span></div>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Kayak Schedule</a></li>
                <li><a href="testing.html">Session Booking</a></li>
                <li><a href="my_booking.html" class="active">My Booking</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contacts</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main>
        <div class="title-container">
            <i class="fa-regular fa-calendar-check"></i>
            <h1>My Booking</h1>
        </div>

        <div class="my-booking-grid">
            
            <!-- Left Panel: Username display -->
            <div class="form-group">
                <label for="usernameDisplay">Username</label>
                <div class="pill-container">
                    <i class="fa-regular fa-user field-icon"></i>
                    <input type="text" id="usernameDisplay" placeholder="username@gmail.com" readonly>
                </div>
            </div>

            <!-- Right Panel: Bold details card -->
            <div class="detail-card">
                <h2>Detail of Booking</h2>
                <div class="detail-list">
                    
                    <div class="detail-item">
                        <span>Username :</span>
                        <span id="lbl-username" class="detail-val"></span>
                    </div>
                    
                    <div class="detail-item">
                        <span>Session :</span>
                        <span id="lbl-session" class="detail-val"></span>
                    </div>
                    
                    <div class="detail-item">
                        <span>Date / Time :</span>
                        <span id="lbl-datetime" class="detail-val"></span>
                    </div>
                    
                    <div class="detail-item">
                        <span>Type of Kayak :</span>
                        <span id="lbl-kayak" class="detail-val"></span>
                    </div>
                    
                    <div class="detail-item">
                        <span>Pax :</span>
                        <span id="lbl-pax" class="detail-val"></span>
                    </div>
                    
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <div class="footer-left">
            Universiti Teknologi PETRONAS • UTP HYDRA Kayak Team
        </div>
        <div class="footer-right">
            +60 xxx xxxx<br>
            <a href="mailto:sharedmailbox@utp.edu.my">sharedmailbox@utp.edu.my</a>
        </div>
    </footer>

    <!-- Retrieve details script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Retrieve booking data saved in the browser memory
            const savedData = localStorage.getItem('kayakBooking');
            
            if (savedData) {
                const booking = JSON.parse(savedData);
                
                // Set the Username value on the left pill field
                document.getElementById('usernameDisplay').value = booking.username;
                
                // Populate details card table
                document.getElementById('lbl-username').textContent = booking.username;
                document.getElementById('lbl-pax').textContent = booking.pax;
                
                // Map kayak type code to plain English text
                let kayakName = booking.kayakType;
                if (kayakName === 'single') kayakName = 'Single Kayak';
                if (kayakName === 'double') kayakName = 'Double Kayak';
                document.getElementById('lbl-kayak').textContent = kayakName;
                
                // Map day/time option code to formatted text
                let timeText = booking.dayTime;
                if (timeText === 'weekday-morning') timeText = 'Weekdays - Morning';
                if (timeText === 'weekday-evening') timeText = 'Weekdays - Evening';
                if (timeText === 'weekend-morning') timeText = 'Weekends - Morning';
                if (timeText === 'weekend-evening') timeText = 'Weekends - Evening';
                document.getElementById('lbl-datetime').textContent = timeText;

                // Map slot code to plain session timing text
                let sessionText = booking.sessionSlot;
                if (sessionText === 'slot1') sessionText = 'Session 1 (08:00 AM - 10:00 AM)';
                if (sessionText === 'slot2') sessionText = 'Session 2 (10:30 AM - 12:30 PM)';
                if (sessionText === 'slot3') sessionText = 'Session 3 (02:30 PM - 04:30 PM)';
                if (sessionText === 'slot4') sessionText = 'Session 4 (05:00 PM - 07:00 PM)';
                document.getElementById('lbl-session').textContent = sessionText;
            }
        });
    </script>
</body>
</html>
